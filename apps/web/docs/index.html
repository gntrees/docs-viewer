<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/favicon.svg" />
    <script>
      // Apply the saved theme before first paint to avoid a flash of the wrong theme.
      try {
        var t = localStorage.getItem("gnt-docs-viewer-theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="/src/style.css" />
    <title>Docs — gntrees docs-viewer</title>
    <meta name="description" content="Documentation for @gntrees/docs-viewer." />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="../">gntrees <span>docs-viewer</span></a>
      <nav class="site-nav">
        <a href="../">Home</a>
        <a href="./" aria-current="page">Docs</a>
        <button class="icon-button" id="theme-toggle" type="button" aria-label="Toggle theme">◐</button>
      </nav>
    </header>

    <div class="docs-layout">
      <aside class="docs-sidebar">
        <nav id="toc" aria-label="Documentation"></nav>
      </aside>
      <article class="docs-content" id="content"></article>
    </div>

    <script type="module" src="/src/docs.ts"></script>
  </body>
</html>
