<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <script>
      // Apply the saved theme before first paint to avoid a flash of the wrong theme.
      try {
        var t = localStorage.getItem("gnt-docs-viewer-theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="/src/style.css" />
    <title>Docs — gntrees docs-viewer</title>
    <meta name="description" content="Documentation for @gntrees/docs-viewer." />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="../">gntrees <span>docs-viewer</span></a>
      <nav class="site-nav">
        <a href="../">Home</a>
        <a href="./" aria-current="page">Docs</a>
        <a
          class="icon-button"
          href="https://github.com/gntrees/docs-viewer"
          target="_blank"
          rel="noopener"
          aria-label="GitHub repository"
        >
          <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.012 8.012 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
        </a>
        <button class="icon-button" id="theme-toggle" type="button" aria-label="Toggle theme">◐</button>
      </nav>
    </header>

    <div class="docs-layout">
      <aside class="docs-sidebar">
        <nav id="toc" aria-label="Documentation"></nav>
      </aside>
      <article class="docs-content" id="content"></article>
    </div>

    <script type="module" src="/src/docs.ts"></script>
  </body>
</html>
