name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Lint check
        run: bun run check

      - name: Typecheck
        run: |
          bun run viewer:typecheck
          bun run web:typecheck
          bun run frameworks:typecheck

      - name: Test
        run: bun run viewer:test

      - name: Build
        run: |
          bun run viewer:build
          bun run web:build
          bun run frameworks:build
